<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,
  body {
    margin: 0;
    background: #0f0;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
  }
</style>
<canvas id="c"></canvas><video id="v" playsinline muted hidden></video>
<script type="module">
  import {
    ImageSegmenter,
    FilesetResolver,
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const v = document.getElementById("v"),
    c = document.getElementById("c"),
    ctx = c.getContext("2d", { willReadFrequently: true });
  const fs = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
  );
  const seg = await ImageSegmenter.createFromOptions(fs, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    outputCategoryMask: true,
    outputConfidenceMasks: false,
  });
  document.body.addEventListener(
    "click",
    async () => {
      await document.documentElement.requestFullscreen();
      v.srcObject = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 60 },
        },
      });
      await v.play();
      c.width = "100dvw";
      c.height = "100dvh";
      loop();
    },
    { once: true },
  );
  function loop() {
    seg.segmentForVideo(v, performance.now(), (r) => {
      ctx.drawImage(v, 0, 0);
      const img = ctx.getImageData(0, 0, c.width, c.height),
        m = r.categoryMask.getAsUint8Array(),
        d = img.data;
      for (let i = 0; i < m.length; i++)
        if (m[i] !== 0) {
          d[i * 4] = 0;
          d[i * 4 + 1] = 255;
          d[i * 4 + 2] = 0;
        }
      ctx.putImageData(img, 0, 0);
      r.categoryMask.close();
    });
    v.requestVideoFrameCallback(loop);
  }
</script>
